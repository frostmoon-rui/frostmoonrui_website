name: Render studio content
on:
  push:
    branches: [main]
    paths: ['content/**']
permissions:
  contents: write
concurrency:
  group: render-studio-content
  cancel-in-progress: false
jobs:
  render:
    if: startsWith(github.event.head_commit.message, 'Studio: ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify public content
        run: |
          node scripts/build.mjs
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -q
      - name: Synchronize generated pages without overwriting newer commits
        run: |
          git add -- dist/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render studio content'
          git push origin HEAD:main
